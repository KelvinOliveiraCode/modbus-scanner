name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, tipos e formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        # Caractere de substituicao ou ideograma CJK em arquivo de codigo
        # aparece como lixo no diff do GitHub. Falhar aqui e mais barato.
        run: python tools/verificar_encoding.py

      - name: Conferir os links dos READMEs
        # Link quebrado em README e pior do que README sem link.
        run: python tools/verificar_links.py

      - name: Lint
        run: ruff check --output-format=github .

      - name: Conferir o formato
        run: ruff format --check .

      - name: Conferir os tipos
        run: mypy

  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A versao minima declarada no pyproject e a ultima estavel. O
        # laboratorio roda em loopback e nao usa API de plataforma, entao
        # roda igual nos dois sistemas.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verificar que o pacote importa
        run: python -c "import modbuslab; print(modbuslab.__version__)"

      - name: Rodar testes com cobertura
        # fail_under=70 esta no pyproject.toml; cobertura abaixo derruba o build.
        run: python -m pytest --cov=modbuslab --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        # Sobe o servidor de lab, varre o barramento e le os tres medidores
        # por Modbus TCP. E o teste que a suite nao cobre sozinha: ela prova
        # que cada funcao funciona, nao que o fluxo inteiro entrega os tres
        # medidores, acha a sequencia de fase invertida e bate o consumo com
        # os registradores.
        run: python tools/verificar_aceite.py

      - name: Conferir que os exemplos batem com o codigo
        # Regenera os exemplos e falha se houver diferenca. Um exemplo
        # desatualizado ensina o numero errado para quem le.
        run: |
          python tools/gerar_exemplos.py
          git diff --exit-code -- exemplos/
