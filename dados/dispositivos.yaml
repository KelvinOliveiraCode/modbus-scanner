# Dispositivos ficticios do lab Modbus.
#
# Todos os dados sao inventados e servem apenas para exercitar o protocolo.
#
# Os valores aqui sao de ENGENHARIA, nao os brutos do fio. O mapa de
# registradores traz a escala e o carregador aplica a conversao, entao o fator
# de potencia se escreve 0.962 e nao 962. O carregador valida cada valor contra
# o tipo do registrador, entao um valor fora da faixa falha ao carregar e nao
# no primeiro atendimento do servidor.
#
# O medidor trifasico tem angulo_l2 = 120 e angulo_l3 = 240. Isso produz um salto
# de 120 graus de L1 para L2, que e sequencia NEGATIVA: a ligacao das fases L2 e
# L3 esta invertida de proposito, para o scanner ter o que encontrar. E o erro de
# campo classico de instalacao trifasica.

versao: 1

dispositivos:
  - id: 1
    nome: "medidor-1pn"
    tipo: "medidor monofasico"
    mapa: medidor_1pn
    fases: 1
    valores:
      tensao: 219.4
      corrente: 12.35
      potencia_ativa: 2430
      potencia_reativa: 890
      energia: 18432
      frequencia: 60.01
      fator_potencia: 0.939

  - id: 2
