[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbuslab"
version = "1.0.0"
description = "Servidor Modbus TCP do zero com medidores de energia e scanner de barramento"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["modbus", "modbus-tcp", "bms", "energia", "automacao-predial", "scada"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
# O protocolo Modbus TCP e implementado do zero sobre socket da biblioteca
# padrao. A unica dependencia e PyYAML, para os arquivos de dados, e a escolha
# e deliberada: um cliente de automacao que precisa instalar uma arvore de
# dependencias para ler um medidor nao roda em campo.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
modbuslab = "modbuslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # Nomes em portugues do dominio (ExcecaoRemota, QuadroInvalido) sao
    # intencionais: o projeto fala a mesma lingua nos identificadores e nos
    # textos, e misturar os dois tornaria o codigo mais dificil de ler.
    "N818",
    # O __all__ e agrupado por modulo, com comentario dizendo a qual modulo
    # cada nome pertence. Ordenar alfabeticamente destruiria essa leitura.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# A suite repete nomes como setup em varios modulos, por legibilidade.
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["modbuslab"]

[tool.mypy]
python_version = "3.10"
files = ["src/modbuslab"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["modbuslab"]

[tool.coverage.report]
show_missing = true
# O padrao do portfolio e 70%; o mesmo piso aqui, para que uma regressao de
# cobertura derrube o build em vez de passar despercebida.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]