[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbuslab"
version = "1.0.0"
description = "Servidor Modbus TCP do zero com medidores de energia e scanner de barramento"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["modbus", "modbus-tcp", "bms", "energia", "automacao-predial", "scada"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
# O protocolo Modbus TCP e implementado do zero sobre socket da biblioteca
# padrao. A unica dependencia e PyYAML, para os arquivos de dados, e a escolha
# e deliberada: um cliente de automacao que precisa instalar uma arvore de
# dependencias para ler um medidor nao roda em campo.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
modbuslab = "modbuslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["modbuslab"]

[tool.coverage.report]
show_missing = true
# O padrao do portfolio e 70%; o mesmo piso aqui, para que uma regressao de
# cobertura derrube o build em vez de passar despercebida.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]